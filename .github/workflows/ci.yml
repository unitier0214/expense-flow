name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode test
      - run: ./mvnw --batch-mode verify
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-password
        run: docker compose config --quiet
      - name: Run demo Compose smoke test
        env:
          POSTGRES_PASSWORD: ci-password
          SPRING_PROFILES_ACTIVE: demo
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color; docker compose down' EXIT
          wait_for_health() {
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                return 0
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Timed out waiting for the application healthcheck." >&2
                return 1
              fi
              sleep 2
            done
          }

          docker compose up -d --build
          wait_for_health

          cookies=$(mktemp)
          login_page=$(mktemp)
          new_page=$(mktemp)
          expenses_page=$(mktemp)
          detail_page=$(mktemp)
          edit_page=$(mktemp)
          edited_detail_page=$(mktemp)
          csv_page=$(mktemp)
          approver_login_page=$(mktemp)
          approvals_page=$(mktemp)
          approver_detail_page=$(mktemp)
          returned_detail_page=$(mktemp)
          employee_login_page=$(mktemp)
          returned_employee_detail_page=$(mktemp)
          resubmitted_detail_page=$(mktemp)
          second_approver_login_page=$(mktemp)
          approved_detail_page=$(mktemp)
          login_headers=$(mktemp)
          create_headers=$(mktemp)
          edit_headers=$(mktemp)
          submit_headers=$(mktemp)
          logout_headers=$(mktemp)
          extract_csrf() {
            python3 - "$1" <<'PY'
          import sys
          from html.parser import HTMLParser

          class CsrfParser(HTMLParser):
              token = None

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag == "input" and attributes.get("name") == "_csrf":
                      self.token = attributes.get("value")

          parser = CsrfParser()
          with open(sys.argv[1], encoding="utf-8") as page:
              parser.feed(page.read())
          if not parser.token:
              raise SystemExit("CSRF input not found")
          print(parser.token)
          PY
          }
          extract_input() {
            python3 - "$1" "$2" <<'PY'
          import sys
          from html.parser import HTMLParser

          class InputParser(HTMLParser):
              value = None

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag == "input" and attributes.get("name") == sys.argv[2]:
                      self.value = attributes.get("value")

          parser = InputParser()
          with open(sys.argv[1], encoding="utf-8") as page:
              parser.feed(page.read())
          if parser.value is None:
              raise SystemExit(f"input not found: {sys.argv[2]}")
          print(parser.value)
          PY
          }
          location_path() {
            awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2; exit }' "$1" \
              | sed 's#^http://localhost:8080##'
          }
          login_as() {
            local username="$1"
            local login_page_path="$2"
            local login_headers_path="$3"
            curl --fail --silent --cookie-jar "$cookies" --output "$login_page_path" http://localhost:8080/login
            local login_csrf
            login_csrf=$(extract_csrf "$login_page_path")
            local login_status
            login_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" \
              --dump-header "$login_headers_path" --output /dev/null --write-out '%{http_code}' \
              --data-urlencode "username=$username" --data-urlencode "password=demo-password" \
              --data-urlencode "_csrf=$login_csrf" http://localhost:8080/login)
            echo "login $username HTTP status: $login_status"
            test "$login_status" = "302"
            local login_location
            login_location=$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2; exit }' "$login_headers_path")
            login_location="${login_location#http://localhost:8080}"
            echo "login $username Location: $login_location"
            test "$login_location" = "/expenses"
          }
          curl --fail --silent --cookie-jar "$cookies" --output "$login_page" http://localhost:8080/login
          grep -q '経費申請・承認システム' "$login_page"
          grep -q 'JSESSIONID' "$cookies"
          csrf=$(extract_csrf "$login_page")
          test -n "$csrf"

          login_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" --dump-header "$login_headers" --output /dev/null --write-out '%{http_code}' --data-urlencode "username=demo.employee" --data-urlencode "password=demo-password" --data-urlencode "_csrf=$csrf" http://localhost:8080/login)
          echo "login HTTP status: $login_status"
          test "$login_status" = "302"
          grep -qiE '^location: (http://localhost:8080)?/expenses' "$login_headers"
          expenses_status=$(curl --silent --show-error --cookie "$cookies" --output "$expenses_page" --write-out '%{http_code}' http://localhost:8080/expenses)
          echo "expenses HTTP status: $expenses_status"
          test "$expenses_status" = "200"
          grep -q '経費申請' "$expenses_page"
          grep -q '新規申請' "$expenses_page"

          curl --fail --silent --cookie "$cookies" --output "$new_page" http://localhost:8080/expenses/new
          create_csrf=$(extract_csrf "$new_page")
          test -n "$create_csrf"
          create_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" --dump-header "$create_headers" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "title=Compose smoke申請" \
            --data-urlencode "purpose=CIで作成した申請" \
            --data-urlencode "category=OTHER" \
            --data-urlencode "expenseDate=2026-09-08" \
            --data-urlencode "amount=1200" \
            --data-urlencode "_csrf=$create_csrf" \
            http://localhost:8080/expenses)
          echo "create HTTP status: $create_status"
          test "$create_status" = "303"
          expense_path=$(location_path "$create_headers")
          test -n "$expense_path"

          curl --fail --silent --cookie "$cookies" --output "$detail_page" "http://localhost:8080$expense_path"
          grep -q 'Compose smoke申請' "$detail_page"
          detail_csrf=$(extract_csrf "$detail_page")
          detail_version=$(extract_input "$detail_page" version)
          test -n "$detail_csrf"
          test -n "$detail_version"

          curl --fail --silent --cookie "$cookies" --output "$edit_page" "http://localhost:8080$expense_path/edit"
          edit_csrf=$(extract_csrf "$edit_page")
          edit_version=$(extract_input "$edit_page" version)
          test -n "$edit_csrf"
          test -n "$edit_version"
          edit_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" --dump-header "$edit_headers" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "title=Compose smoke申請（編集済み）" \
            --data-urlencode "purpose=CIで編集した申請" \
            --data-urlencode "category=OTHER" \
            --data-urlencode "expenseDate=2026-09-08" \
            --data-urlencode "amount=1300" \
            --data-urlencode "version=$edit_version" \
            --data-urlencode "_csrf=$edit_csrf" \
            "http://localhost:8080$expense_path/edit")
          echo "edit HTTP status: $edit_status"
          test "$edit_status" = "303"

          curl --fail --silent --cookie "$cookies" --output "$edited_detail_page" "http://localhost:8080$expense_path"
          grep -q 'Compose smoke申請（編集済み）' "$edited_detail_page"
          submit_csrf=$(extract_csrf "$edited_detail_page")
          submit_version=$(extract_input "$edited_detail_page" version)
          test -n "$submit_csrf"
          test -n "$submit_version"
          submit_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" --dump-header "$submit_headers" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "version=$submit_version" \
            --data-urlencode "_csrf=$submit_csrf" \
            "http://localhost:8080$expense_path/submit")
          echo "submit HTTP status: $submit_status"
          test "$submit_status" = "303"

          curl --fail --silent --cookie "$cookies" --output "$detail_page" "http://localhost:8080$expense_path"
          grep -q 'Compose smoke申請（編集済み）' "$detail_page"
          grep -q '申請' "$detail_page"
          grep -q '作成' "$detail_page"
          grep -q '更新' "$detail_page"
          csv_status=$(curl --silent --show-error --cookie "$cookies" --output "$csv_page" --write-out '%{http_code}' \
            'http://localhost:8080/expenses/export.csv?status=SUBMITTED&q=Compose%20smoke')
          echo "csv HTTP status: $csv_status"
          test "$csv_status" = "200"
          python3 - "$csv_page" <<'PY'
          import sys

          with open(sys.argv[1], "rb") as csv_file:
              csv_text = csv_file.read().decode("utf-8-sig")
          assert csv_text.startswith("ID,件名,分類,利用日,金額,状態,更新日時\r\n")
          assert "Compose smoke申請（編集済み）" in csv_text
          assert ",申請中," in csv_text
          PY
          logout_csrf=$(extract_csrf "$detail_page")
          test -n "$logout_csrf"

          logout_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" --dump-header "$logout_headers" --output /dev/null --write-out '%{http_code}' --data-urlencode "_csrf=$logout_csrf" http://localhost:8080/logout)
          echo "logout HTTP status: $logout_status"
          test "$logout_status" = "302"
          grep -qiE '^location: (http://localhost:8080)?/login[?]logout' "$logout_headers"

          login_as "demo.approver.sales.1" "$approver_login_page" "$login_headers"
          approvals_http_status=$(curl --silent --show-error --cookie "$cookies" --output "$approvals_page" --write-out '%{http_code}' http://localhost:8080/approvals)
          echo "approvals HTTP status: $approvals_http_status"
          test "$approvals_http_status" = "200"
          grep -q 'Compose smoke申請（編集済み）' "$approvals_page"
          grep -q '申請中' "$approvals_page"
          curl --fail --silent --cookie "$cookies" --output "$approver_detail_page" "http://localhost:8080$expense_path"
          grep -q 'Compose smoke申請（編集済み）' "$approver_detail_page"
          approval_csrf=$(extract_csrf "$approver_detail_page")
          approval_version=$(extract_input "$approver_detail_page" version)
          test -n "$approval_csrf"
          test -n "$approval_version"
          return_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" \
            --dump-header "$logout_headers" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "version=$approval_version" \
            --data-urlencode "comment=CIで確認した差戻し理由" \
            --data-urlencode "_csrf=$approval_csrf" \
            "http://localhost:8080$expense_path/return")
          echo "return HTTP status: $return_status"
          test "$return_status" = "303"
          curl --fail --silent --cookie "$cookies" --output "$returned_detail_page" "http://localhost:8080$expense_path"
          grep -q '差戻し' "$returned_detail_page"
          grep -q 'CIで確認した差戻し理由' "$returned_detail_page"
          approver_logout_csrf=$(extract_csrf "$returned_detail_page")
          approver_logout_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" \
            --dump-header "$logout_headers" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "_csrf=$approver_logout_csrf" http://localhost:8080/logout)
          echo "approver logout HTTP status: $approver_logout_status"
          test "$approver_logout_status" = "302"

          login_as "demo.employee" "$employee_login_page" "$login_headers"
          curl --fail --silent --cookie "$cookies" --output "$returned_employee_detail_page" "http://localhost:8080$expense_path"
          grep -q 'Compose smoke申請（編集済み）' "$returned_employee_detail_page"
          grep -q '差戻し' "$returned_employee_detail_page"
          grep -q 'CIで確認した差戻し理由' "$returned_employee_detail_page"
          curl --fail --silent --cookie "$cookies" --output "$edit_page" "http://localhost:8080$expense_path/edit"
          returned_edit_csrf=$(extract_csrf "$edit_page")
          returned_edit_version=$(extract_input "$edit_page" version)
          resubmit_edit_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" \
            --dump-header "$edit_headers" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "title=Compose smoke申請（修正再申請）" \
            --data-urlencode "purpose=CIで差戻し修正した申請" \
            --data-urlencode "category=OTHER" \
            --data-urlencode "expenseDate=2026-09-08" \
            --data-urlencode "amount=1400" \
            --data-urlencode "version=$returned_edit_version" \
            --data-urlencode "_csrf=$returned_edit_csrf" \
            "http://localhost:8080$expense_path/edit")
          echo "returned edit HTTP status: $resubmit_edit_status"
          test "$resubmit_edit_status" = "303"
          curl --fail --silent --cookie "$cookies" --output "$resubmitted_detail_page" "http://localhost:8080$expense_path"
          grep -q 'Compose smoke申請（修正再申請）' "$resubmitted_detail_page"
          resubmit_csrf=$(extract_csrf "$resubmitted_detail_page")
          resubmit_version=$(extract_input "$resubmitted_detail_page" version)
          resubmit_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" \
            --dump-header "$submit_headers" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "version=$resubmit_version" \
            --data-urlencode "_csrf=$resubmit_csrf" \
            "http://localhost:8080$expense_path/submit")
          echo "resubmit HTTP status: $resubmit_status"
          test "$resubmit_status" = "303"
          curl --fail --silent --cookie "$cookies" --output "$resubmitted_detail_page" "http://localhost:8080$expense_path"
          grep -q 'Compose smoke申請（修正再申請）' "$resubmitted_detail_page"
          grep -q '申請中' "$resubmitted_detail_page"
          employee_logout_csrf=$(extract_csrf "$resubmitted_detail_page")
          employee_logout_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" \
            --dump-header "$logout_headers" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "_csrf=$employee_logout_csrf" http://localhost:8080/logout)
          echo "employee logout HTTP status: $employee_logout_status"
          test "$employee_logout_status" = "302"

          login_as "demo.approver.sales.2" "$second_approver_login_page" "$login_headers"
          curl --fail --silent --cookie "$cookies" --output "$approvals_page" http://localhost:8080/approvals
          grep -q 'Compose smoke申請（修正再申請）' "$approvals_page"
          curl --fail --silent --cookie "$cookies" --output "$approver_detail_page" "http://localhost:8080$expense_path"
          approval_csrf=$(extract_csrf "$approver_detail_page")
          approval_version=$(extract_input "$approver_detail_page" version)
          approve_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" \
            --dump-header "$logout_headers" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "version=$approval_version" \
            --data-urlencode "comment=CIで確認済み" \
            --data-urlencode "_csrf=$approval_csrf" \
            "http://localhost:8080$expense_path/approve")
          echo "approve HTTP status: $approve_status"
          test "$approve_status" = "303"
          curl --fail --silent --cookie "$cookies" --output "$approved_detail_page" "http://localhost:8080$expense_path"
          grep -q 'Compose smoke申請（修正再申請）' "$approved_detail_page"
          grep -q '承認済み' "$approved_detail_page"
          grep -q 'CIで確認済み' "$approved_detail_page"
          grep -q '承認' "$approved_detail_page"
          final_logout_csrf=$(extract_csrf "$approved_detail_page")
          final_logout_status=$(curl --silent --show-error --cookie "$cookies" --cookie-jar "$cookies" \
            --dump-header "$logout_headers" --output /dev/null --write-out '%{http_code}' \
            --data-urlencode "_csrf=$final_logout_csrf" http://localhost:8080/logout)
          echo "final logout HTTP status: $final_logout_status"
          test "$final_logout_status" = "302"

          protected_status=$(curl --silent --show-error --cookie "$cookies" --output /dev/null --write-out '%{http_code}' http://localhost:8080/expenses)
          echo "protected page after logout HTTP status: $protected_status"
          test "$protected_status" = "302"

          docker compose exec -T db psql -U expenseflow -d expenseflow -v ON_ERROR_STOP=1 -c "UPDATE users SET display_name = '永続化確認' WHERE username = 'demo.employee';"
          docker compose down
          docker compose up -d
          wait_for_health
          persisted_name=$(docker compose exec -T db psql -U expenseflow -d expenseflow -Atc "SELECT display_name FROM users WHERE username = 'demo.employee';")
          test "$persisted_name" = "永続化確認"
