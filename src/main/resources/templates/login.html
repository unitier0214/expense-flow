<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | ExpenseFlow</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-card" aria-labelledby="login-title">
    <p class="eyebrow">ExpenseFlow</p>
    <h1 id="login-title">経費申請・承認システム</h1>
    <p class="muted">アカウントにログインしてください。</p>

    <div th:if="${param.error}" class="alert alert-error" role="alert">
        ユーザー名またはパスワードが正しくありません。
    </div>
    <div th:if="${param.logout}" class="alert alert-success" role="status">
        ログアウトしました。
    </div>

    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-field">
            <label for="username">ユーザー名</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="form-field">
            <label for="password">パスワード</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button button-primary button-block" type="submit">ログイン</button>
    </form>

    <p class="form-note">デモユーザーは <code>demo</code> プロファイル起動時だけ利用できます。</p>
</main>
</body>
</html>
