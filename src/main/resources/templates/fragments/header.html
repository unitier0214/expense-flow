<header class="site-header" th:fragment="header">
    <a class="brand" th:href="@{/expenses}">ExpenseFlow</a>
    <nav aria-label="メインナビゲーション">
        <span class="user-name" th:text="${currentUsername}">user</span>
        <a th:if="${currentIsApprover}" th:href="@{/approvals}">承認待ち</a>
        <form method="post" th:action="@{/logout}" class="inline-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="button button-link" type="submit">ログアウト</button>
        </form>
    </nav>
</header>
