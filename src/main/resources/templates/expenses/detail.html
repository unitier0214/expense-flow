<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${detail.title + ' | ExpenseFlow'}">申請詳細 | ExpenseFlow</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="page-shell" aria-labelledby="page-title">
    <div class="page-heading">
        <div>
            <p class="eyebrow">申請詳細</p>
            <h1 id="page-title" th:text="${detail.title}">経費申請</h1>
        </div>
        <span class="status large-status" th:classappend="| status-${detail.status.toLowerCase()}|"
              th:text="${detail.statusLabel}">下書き</span>
    </div>

    <section class="panel detail-panel" aria-labelledby="content-title">
        <div class="section-heading">
            <h2 id="content-title">申請内容</h2>
            <span class="muted" th:text="|version: ${detail.version}|">version: 0</span>
        </div>
        <dl class="detail-grid">
            <dt>申請者</dt><dd th:text="|${detail.applicantName}（${detail.applicantUsername}）|">テスト社員</dd>
            <dt>部署</dt><dd th:text="${detail.departmentName}">テスト部</dd>
            <dt>件名</dt><dd th:text="${detail.title}">件名</dd>
            <dt>用途</dt><dd class="preformatted" th:text="${detail.purpose}">用途</dd>
            <dt>分類</dt><dd th:text="${detail.categoryLabel}">交通費</dd>
            <dt>利用日</dt><dd th:text="${detail.expenseDate}">2026-09-01</dd>
            <dt>金額</dt><dd class="amount-cell" th:text="|${detail.amount}円|">1,000円</dd>
            <dt>作成日時</dt><dd th:text="${detail.createdAt}">2026/09/09 20:00</dd>
            <dt>最終更新</dt><dd th:text="${detail.updatedAt}">2026/09/09 20:00</dd>
            <dt>直近申請日時</dt><dd th:text="${detail.submittedAt}">—</dd>
        </dl>
        <div class="form-actions detail-actions">
            <a class="button button-secondary" th:href="@{/expenses}">一覧へ戻る</a>
            <a th:if="${detail.canEdit}" class="button button-secondary"
               th:href="@{/expenses/{id}/edit(id=${detail.id})}">編集</a>
            <form th:if="${detail.canDelete}" method="post"
                  th:action="@{/expenses/{id}/delete(id=${detail.id})}" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="version" th:value="${detail.version}">
                <button class="button button-danger" type="submit">下書きを削除</button>
            </form>
            <form th:if="${detail.canSubmit}" method="post"
                  th:action="@{/expenses/{id}/submit(id=${detail.id})}" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="version" th:value="${detail.version}">
                <button class="button button-primary" type="submit">申請する</button>
            </form>
        </div>
    </section>

    <section th:if="${detail.canApprove}" class="panel approval-panel" aria-labelledby="approval-title">
        <div class="section-heading">
            <h2 id="approval-title">承認・差戻し</h2>
            <span class="muted">同じ部署の申請を確認してください</span>
        </div>
        <div th:if="${hasApprovalError}" class="alert alert-error" role="alert">
            入力内容を確認してください。
        </div>
        <p th:if="${approvalErrors.containsKey('version')}" class="field-error"
           th:text="${approvalErrors['version']}" role="alert">versionエラー</p>
        <form method="post" th:action="@{/expenses/{id}/approve(id=${detail.id})}" class="approval-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="version" th:value="${detail.version}">
            <div class="form-field">
                <label for="approval-comment">承認コメント（任意）</label>
                <textarea id="approval-comment" name="comment" maxlength="500"
                          aria-describedby="approval-comment-error"
                          th:text="${approvalForm.comment}"></textarea>
                <p id="approval-comment-error" th:if="${approvalErrors.containsKey('comment')}"
                   class="field-error" th:text="${approvalErrors['comment']}" role="alert">コメントエラー</p>
            </div>
            <button class="button button-primary" type="submit">承認する</button>
        </form>
        <form method="post" th:action="@{/expenses/{id}/return(id=${detail.id})}" class="approval-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="version" th:value="${detail.version}">
            <div class="form-field">
                <label for="return-comment">差戻し理由（必須）</label>
                <textarea id="return-comment" name="comment" maxlength="500"
                          aria-describedby="return-comment-error"
                          th:text="${approvalForm.comment}"></textarea>
                <p id="return-comment-error" th:if="${approvalErrors.containsKey('comment')}"
                   class="field-error" th:text="${approvalErrors['comment']}" role="alert">理由エラー</p>
            </div>
            <button class="button button-danger" type="submit">差し戻す</button>
        </form>
    </section>

    <section class="panel" aria-labelledby="history-title">
        <div class="section-heading">
            <h2 id="history-title">履歴</h2>
            <span class="muted" th:text="|${#lists.size(detail.events)}件|">0件</span>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th scope="col">日時</th>
                    <th scope="col">操作者</th>
                    <th scope="col">操作</th>
                    <th scope="col">状態</th>
                    <th scope="col">コメント</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="event : ${detail.events}">
                    <td th:text="${event.occurredAt}">2026/09/09 20:00</td>
                    <td th:text="${event.actorName}">テスト社員</td>
                    <td th:text="${event.actionLabel}">作成</td>
                    <td th:text="|${event.fromStatusLabel} → ${event.toStatusLabel}|">— → 下書き</td>
                    <td th:text="${event.comment == null ? '—' : event.comment}">—</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
